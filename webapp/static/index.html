<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NegativePluribus · стол</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div class="brand">Negative<span>Pluribus</span></div>
  <div class="session" id="session">
    <div class="s-item"><label>раздач</label><b id="s-hands">0</b></div>
    <div class="s-item"><label>итог</label><b id="s-net">0 bb</b></div>
    <div class="s-item" title="выигрыш на 100 раздач; ± — 95% доверительный интервал: истинный винрейт с вероятностью 95% лежит в этих пределах">
      <label>bb/100</label><b id="s-bb100">0.0</b><small id="s-ci"></small>
    </div>
  </div>
</header>

<main class="layout">
  <section class="stage">
    <div class="table-wrap">
      <div class="table" id="table">
        <div class="row seat-row">
          <div class="seat" id="seat-1">
            <div class="cards" id="villain-cards"></div>
            <div class="plaque" id="villain-plaque">
              <div class="avatar">🤖</div>
              <div class="meta">
                <div class="name" id="villain-name">Бот</div>
                <div class="stack" id="villain-stack">—</div>
                <div class="hand-name" id="villain-hand"></div>
              </div>
              <div class="pos-badge" id="villain-pos">BB</div>
            </div>
          </div>
        </div>
        <div class="row bet-row"><div class="bet" id="villain-bet"></div></div>
        <div class="row pot-row"><div class="pot" id="pot"></div></div>
        <div class="row board-row">
          <div class="board" id="board">
            <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
          </div>
        </div>
        <div class="row bet-row"><div class="bet" id="hero-bet"></div></div>
        <div class="row seat-row">
          <div class="seat" id="seat-0">
            <div class="cards" id="hero-cards"></div>
            <div class="plaque" id="hero-plaque">
              <div class="avatar">🧑</div>
              <div class="meta">
                <div class="name">Вы</div>
                <div class="stack" id="hero-stack">—</div>
                <div class="hand-name" id="hero-hand"></div>
              </div>
              <div class="pos-badge" id="hero-pos">BTN</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="actionbar" id="actionbar">
      <div class="actions" id="actions"></div>
    </div>
  </section>

  <aside class="panel">
    <section class="card-block">
      <h3>Бот</h3>
      <select id="bot-select" class="select"></select>
      <div class="muted small" id="bot-note"></div>
    </section>

    <section class="card-block">
      <h3>Сессия</h3>
      <div class="chart" id="chart"></div>
      <div class="kv" id="matches"></div>
      <label class="toggle" title="стеки переходят из раздачи в раздачу, пока у кого-то не кончатся фишки">
        <input type="checkbox" id="opt-carry" checked>
        <span>играть до банкротства (стеки не сбрасываются)</span>
      </label>
      <div class="muted small" id="carry-note"></div>
      <div class="btn-row">
        <a class="btn-sm" id="btn-export" href="/api/export" download title="история рук в формате PokerStars — для трекера">Экспорт истории</a>
        <button class="btn-sm danger" id="btn-reset" title="обнулить счёт, историю и стеки">Сбросить сессию</button>
      </div>
    </section>

    <section class="card-block">
      <h3 id="review-title">Раздача</h3>
      <div class="review" id="review"><div class="muted">—</div></div>
    </section>

    <section class="card-block">
      <h3>Руки сессии</h3>
      <div class="history" id="history"><div class="muted">пока пусто</div></div>
    </section>

    <section class="card-block">
      <h3>Настройки</h3>
      <label class="toggle"><input type="checkbox" id="opt-auto" checked><span>новая раздача автоматически</span></label>
      <label class="toggle"><input type="checkbox" id="opt-reveal"><span>показывать карты бота, если он сбросил</span></label>
      <div class="field">
        <span>суммы</span>
        <div class="seg" id="opt-units"><button data-v="bb">в bb</button><button data-v="chips">в фишках</button></div>
      </div>
      <div class="field">
        <span>темп бота</span>
        <div class="seg" id="opt-speed"><button data-v="0.45">быстро</button><button data-v="1">обычно</button><button data-v="1.7">медленно</button></div>
      </div>
      <div class="keys muted small">
        <kbd>F</kbd> фолд · <kbd>C</kbd> чек/колл · <kbd>1</kbd>…<kbd>5</kbd> размер ставки · <kbd>A</kbd> размер олл-ин ·
        <kbd>↑</kbd><kbd>↓</kbd> размер ±1bb · <kbd>Enter</kbd> поставить · <kbd>N</kbd> новая раздача
      </div>
      <div class="muted small" id="bot-spec"></div>
    </section>
  </aside>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="dialog">
    <div class="spinner"></div>
    <div id="overlay-text">загрузка бота…</div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="tip" id="tip" hidden></div>

<script src="/app.js"></script>
</body>
</html>
